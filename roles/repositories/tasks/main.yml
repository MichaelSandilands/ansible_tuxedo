---
# All third-party repositories and their GPG keys. Extracted out of the
# playbook pre_tasks so package sources live in one auditable place.
# Uses the ansible_distribution_major_version fact directly so the role is
# self-contained and does not depend on playbook-level vars.

- name: Add Tuxedo Computers repository
  ansible.builtin.get_url:
    url: "https://rpm.tuxedocomputers.com/fedora/tuxedo.repo"
    dest: /etc/yum.repos.d/tuxedo.repo
    mode: "0644"

- name: Import Tuxedo Computers GPG key
  ansible.builtin.rpm_key:
    key: "https://rpm.tuxedocomputers.com/fedora/{{ ansible_distribution_major_version }}/0x54840598.pub.asc"
    state: present

- name: Add Docker CE repository
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/fedora/docker-ce.repo"
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"

- name: Import Docker CE GPG key
  ansible.builtin.rpm_key:
    key: "https://download.docker.com/linux/fedora/gpg"
    state: present

- name: Install RPM Fusion repositories
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    # The release RPMs are not signed by a key we hold yet; we import the
    # bundled keys in the next task. This bootstrap exception is intentional.
    disable_gpg_check: true

- name: Import RPM Fusion GPG keys from local disk
  ansible.builtin.rpm_key:
    key: "{{ item }}"
    state: present
  loop:
    - "/etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-{{ ansible_distribution_major_version }}"
    - "/etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-{{ ansible_distribution_major_version }}"

- name: Enable fedora-cisco-openh264 repository
  community.general.ini_file:
    path: /etc/yum.repos.d/fedora-cisco-openh264.repo
    section: fedora-cisco-openh264
    option: enabled
    value: "1"
    mode: "0644"
    no_extra_spaces: true

- name: Enable COPR repositories (Starship, RStudio, WezTerm)
  community.general.copr:
    name:
      - atim/starship
      - iucar/rstudio
      - wez/wezterm
    state: enabled
