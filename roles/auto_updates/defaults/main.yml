---
# Unattended-upgrade behaviour. Defaults preserve the original config.
#
# NOTE on this machine: it installs akmod-nvidia and runs a Tuxedo kernel.
# With upgrade_type=default an unattended kernel bump (reboot=never) leaves a
# running-kernel / installed-kernel mismatch until the next manual reboot,
# during which akmod has to rebuild the Nvidia module. If that bites you,
# set auto_updates_upgrade_type to "security" to limit unattended changes to
# security patches.
auto_updates_upgrade_type: default      # "default" (all) or "security"
auto_updates_random_sleep: 0            # 0 = run immediately when the timer fires
auto_updates_network_online_timeout: 60 # seconds to wait for network (0 = skip check)
auto_updates_download_updates: "yes"
auto_updates_apply_updates: "yes"       # actually install (Fedora default is "no")
auto_updates_reboot: never              # never reboot automatically
auto_updates_emit_via: stdio            # log results to the system journal
auto_updates_debuglevel: 1
